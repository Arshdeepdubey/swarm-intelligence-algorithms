[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-fs"
version = "1.0.0"
description = "Swarm Intelligence Algorithms (PSO, ACO, ABC, Cuckoo Search) for optimal feature selection with SVM classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Abhipsha Sahu" },
    { name = "Sanjivani Sharan" },
    { name = "Arshdeep Dubey" },
    { name = "Abhisman Sarkar" },
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
